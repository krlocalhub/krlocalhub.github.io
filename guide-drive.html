<h1>개인용 NAS 사용 방법</h1>
<p class="meta">PC 프로그램은 Windows 10 · 11 전용, 폰은 아이폰·안드로이드 모두 됩니다. 그림의 <span class="g-mark">빨간 테두리</span>를 차례로 누르면 됩니다.</p>

<h2>1. PC에서 프로그램 받기</h2>
<p>PC에서 <a href="./#programs">프로그램</a> 칸의 개인용 NAS <b>[받기]</b>를 누르면 설치 파일이 <b>다운로드</b> 폴더에 받아집니다. 폰에서는 받을 수 없습니다.</p>
<div class="g-figs">
<figure><div class="g-win"><div class="g-bar"><i></i><i></i><i></i></div>
<div class="g-body"><div class="g-row"><b>개인용 NAS</b><span class="g-btn ghost">사용 방법</span><span class="g-btn hl">받기</span></div>
<div class="g-dl">⬇ PersonalDrive-setup.exe <small>완료</small></div></div></div>
<figcaption>[받기] → 브라우저 다운로드 목록에 파일이 생김</figcaption></figure>
<figure><div class="g-ss"><b>Windows의 PC 보호</b><p>Microsoft Defender SmartScreen에서 인식할 수 없는 앱의 시작을 차단했습니다.</p><span class="g-link hl">추가 정보</span></div>
<figcaption>설치 파일을 더블클릭. 이 파란 창이 뜨면 [추가 정보]</figcaption></figure>
<figure><div class="g-ss"><b>Windows의 PC 보호</b><p>앱: PersonalDrive-setup.exe</p><div class="g-ssb"><span class="g-btn ss hl">실행</span><span class="g-btn ss">실행 안 함</span></div></div>
<figcaption>[실행]을 누르면 설치됨</figcaption></figure>
</div>

<h2>2. 사용 신청 (마스터 PC, 처음 한 번)</h2>
<p>파일이 있는 PC 한 대가 <b>마스터 PC</b>입니다. 프로그램을 켜면 첫 화면이 나옵니다.</p>
<div class="g-figs">
<figure><div class="g-win"><div class="g-navy"><b>개인드라이브 시작하기</b><small>처음 사용인지 기존 회원인지 선택해 주세요.</small></div>
<div class="g-body"><div class="g-cards"><div class="g-card teal hl"><small>처음 사용</small><b>사용 신청</b></div><div class="g-card blue"><small>기존 회원</small><b>로그인</b></div></div>
<p class="g-small g-u">마스터 PC가 따로 있어요 (이 PC는 내 PC 접속으로 쓰기)</p></div></div>
<figcaption>처음이면 [사용 신청] → 입금자명·휴대폰 번호 입력. 체험 후 결제</figcaption></figure>
</div>

<h2>3. 마스터 PC 설정</h2>
<div class="g-figs">
<figure><div class="g-win"><div class="g-bar"><span>개인드라이브 — 마스터 PC</span></div><div class="g-body">
<div class="g-form"><span>공유 폴더</span><div><span class="g-in hl">D:\내 파일</span><span class="g-btn ghost">찾기</span></div>
<span>아이디</span><div><span class="g-in hl">hong</span></div>
<span>비밀번호</span><div><span class="g-in hl">••••••••</span></div></div>
<span class="g-btn big hl">시작</span></div></div>
<figcaption>① 폴더 고르기 ② 폰에서 쓸 아이디·비밀번호(8자 이상) ③ [시작]</figcaption></figure>
<figure><div class="g-win"><div class="g-bar"><span>개인드라이브 — 마스터 PC</span></div><div class="g-body">
<div class="g-row"><b>마스터 폰:</b> 없음 <span class="g-btn ghost hl">마스터 폰 등록 (새 QR)</span></div>
<p class="g-small">마스터 폰의 카메라로 찍으세요.</p><img class="g-qr" src="img/guide-qr.svg" alt=""></div></div>
<figcaption>[마스터 폰 등록 (새 QR)] → [새 QR 만들기]. QR이 뜸</figcaption></figure>
</div>
<p>마스터 PC가 켜져 있고 <b>[시작]</b> 상태일 때만 폰·다른 PC에서 열립니다.</p>

<h2>4. 폰 연결 — 폰 카메라로 QR 찍기</h2>
<p>앱스토어에서 받는 앱은 없습니다. 폰의 <b>기본 카메라</b>로 PC 화면의 QR을 찍고 뜨는 주소를 누르면 "앱으로 설치해 주세요" 화면이 열립니다. 폰에 맞게 홈 화면에 설치하세요.</p>

<h3 class="g-h3">아이폰 (꼭 사파리로)</h3>
<div class="g-figs">
<figure><div class="g-phone"><div class="g-ph-top">개인드라이브</div><div class="g-ph-body"><div class="g-box"><b>앱으로 설치해 주세요</b><p>홈 화면에 설치한 앱에서만 쓸 수 있습니다.</p></div></div>
<div class="g-safari"><span>‹</span><span>›</span><span class="hl g-ic">⬆︎</span><span>📖</span><span>⧉</span></div></div>
<figcaption>아래쪽 <b>공유</b> 버튼(네모에 위 화살표)</figcaption></figure>
<figure><div class="g-phone"><div class="g-ph-body g-dim"><div class="g-sheet"><div>복사</div><div>읽기 목록에 추가</div><div class="hl">홈 화면에 추가 <span>⊞</span></div><div>즐겨찾기에 추가</div></div></div></div>
<figcaption>[홈 화면에 추가] → 오른쪽 위 [추가]</figcaption></figure>
<figure><div class="g-phone"><div class="g-home"><span><i>📷</i>카메라</span><span><i>🧭</i>Safari</span><span class="hl"><i class="g-app">▤</i>개인드라이브</span><span><i>⚙️</i>설정</span></div></div>
<figcaption>홈 화면에 생긴 <b>개인드라이브</b> 앱을 엽니다</figcaption></figure>
</div>

<h3 class="g-h3">안드로이드 (크롬 또는 삼성 인터넷)</h3>
<div class="g-figs">
<figure><div class="g-phone"><div class="g-chrome"><span class="g-url">개인드라이브</span><span class="g-ic">⋮</span></div><div class="g-ph-body"><div class="g-box"><b>앱으로 설치해 주세요</b><p>홈 화면에 설치한 앱에서만 쓸 수 있습니다.</p><span class="g-btn full hl">앱 설치</span></div></div></div>
<figcaption>[앱 설치] 버튼. 없으면 오른쪽 위 메뉴(⋮ 또는 ≡)</figcaption></figure>
<figure><div class="g-phone"><div class="g-chrome"><span class="g-url">개인드라이브</span><span class="g-ic hl">⋮</span></div><div class="g-ph-body"><div class="g-menu"><div>새 탭</div><div>북마크</div><div class="hl">앱 설치</div><div>설정</div></div></div></div>
<figcaption>메뉴의 [앱 설치] 또는 [홈 화면에 추가]</figcaption></figure>
<figure><div class="g-phone"><div class="g-home"><span><i>📷</i>카메라</span><span><i>🌐</i>Chrome</span><span class="hl"><i class="g-app">▤</i>개인드라이브</span><span><i>⚙️</i>설정</span></div></div>
<figcaption>홈 화면의 <b>개인드라이브</b> 앱을 엽니다</figcaption></figure>
</div>

<h2>5. 앱 안에서 등록하고 로그인</h2>
<div class="g-figs">
<figure><div class="g-phone"><div class="g-ph-top">개인드라이브</div><div class="g-ph-body"><div class="g-box"><b>마스터 폰 등록</b><p>마스터 PC의 QR을 아래 버튼으로 찍으세요.</p><span class="g-btn full hl">마스터 PC QR 스캔</span></div></div></div>
<figcaption>[마스터 PC QR 스캔] → 카메라 <b>허용</b> → PC의 QR을 <b>한 번 더</b> 찍기</figcaption></figure>
<figure><div class="g-phone"><div class="g-ph-top">개인드라이브</div><div class="g-ph-body"><div class="g-box"><b>로그인</b><p>마스터 PC에서 정한 아이디와 비밀번호</p><span class="g-in full hl">아이디</span><span class="g-in full hl">비밀번호</span><span class="g-btn full">로그인</span></div></div></div>
<figcaption>3번에서 정한 아이디·비밀번호. 다음부터는 앱만 열면 됨</figcaption></figure>
</div>
<p><b>[새 QR 만들기]를 하면 원래 등록된 폰과 모든 내 PC 접속이 로그아웃</b>됩니다. 폰을 바꿀 때만 쓰세요.</p>

<h2>6. 다른 PC에서 쓰기 (내 PC 접속)</h2>
<p>다른 PC에도 같은 프로그램을 설치합니다. 이 PC는 사용 신청이 필요 없습니다.</p>
<div class="g-figs">
<figure><div class="g-win"><div class="g-navy"><b>개인드라이브 시작하기</b><small>처음 사용인지 기존 회원인지 선택해 주세요.</small></div>
<div class="g-body"><div class="g-cards"><div class="g-card teal"><small>처음 사용</small><b>사용 신청</b></div><div class="g-card blue"><small>기존 회원</small><b>로그인</b></div></div>
<p class="g-small g-u hl">마스터 PC가 따로 있어요 (이 PC는 내 PC 접속으로 쓰기)</p></div></div>
<figcaption>첫 화면 아래 링크를 누르면 QR이 뜸</figcaption></figure>
<figure><div class="g-phone"><div class="g-ph-top">개인드라이브 <span class="g-btn sm hl">📷 QR 스캔</span></div><div class="g-ph-body"><div class="g-list"><div>📁 사진</div><div>📁 문서</div><div>📄 견적서.xlsx</div></div></div></div>
<figcaption>마스터 폰 앱 맨 위 [QR 스캔]으로 PC의 QR을 찍고 아이디·비밀번호 입력</figcaption></figure>
</div>

<h2>안 될 때</h2>
<ul>
<li>폰에서 안 열림: 마스터 PC가 켜져 있고 [시작]을 눌렀는지, 인터넷이 되는지 확인합니다.</li>
<li>카메라가 안 켜짐: 폰 설정에서 사파리(아이폰) 또는 크롬(안드로이드)의 카메라 권한을 허용합니다.</li>
<li>아이폰에서 등록이 안 됨: 사파리 창이 아니라 <b>홈 화면에 설치한 앱 안에서</b> QR을 찍어야 합니다.</li>
<li>QR 시간이 지났다고 나옴: QR은 5분마다 바뀝니다. PC 화면의 지금 QR을 다시 찍습니다.</li>
<li>그래도 안 되면 <a href="./#contact">전화 상담</a>으로 연락 주세요.</li>
</ul>
