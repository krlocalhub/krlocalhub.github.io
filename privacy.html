<h1>개인정보 처리방침</h1>
<p class="meta">시행일: {{시행일}}</p>
<p>{{상호}}(이하 "회사")는 개인정보 보호법 등 관련 법령을 지키며, 이용자의 개인정보를 다음과 같이 처리합니다.</p>

<h2>1. 처리하는 개인정보와 목적</h2>
<table>
<tr><th>언제</th><th>항목</th><th>목적</th></tr>
<tr><td>사용 신청</td><td>이름, 휴대폰 번호</td><td>이용자 확인, 사용 승인, 결제·환불 안내, 고객 상담</td></tr>
<tr><td>프로그램 실행 중 라이선스 확인</td><td>PC 고유번호(하드웨어 정보로 만든 값), PC 이름, 프로그램 이름과 버전, 승인 상태와 이용 기간, 마지막 접속 시각</td><td>승인된 PC에서만 쓰이도록 확인, 업데이트 제공, 부정 사용 방지</td></tr>
<tr><td>서비스 이용 중 자동 생성</td><td>접속 IP 주소, 접속 일시, 서버 접속 기록</td><td>보안, 장애 대응, 부정 접속 방지</td></tr>
<tr><td>기기 연결 기능 사용 시</td><td>연결 정보(연결용 식별값), 연결 일시</td><td>기기 연결, 사용량 확인</td></tr>
</table>
<p>회사는 위 목적 외에는 개인정보를 쓰지 않으며, 목적이 바뀌면 미리 동의를 받습니다. 주민등록번호 등 고유식별정보와 민감정보는 받지 않습니다.</p>

<h2>2. 회사 서버에 보관하지 않는 정보</h2>
<ul>
<li>이용자가 프로그램으로 다루는 업무 자료는 이용자의 PC와 이용자가 연결한 기기 사이에서 전달되며, 회사 서버에 저장하지 않습니다.</li>
<li>중계 서버는 연결이 직접 되지 않을 때 자료를 전달만 하고 보관하지 않습니다.</li>
<li>이 자료는 이용자의 PC에 저장되며, 그 관리 책임은 이용자에게 있습니다.</li>
</ul>

<h2>3. 보유 기간</h2>
<p>개인정보는 목적을 이루면 지체 없이 파기합니다. 다만 다음은 법령에 따라 정해진 기간 동안 보관합니다.</p>
<table>
<tr><th>항목</th><th>근거</th><th>기간</th></tr>
<tr><td>계약 또는 청약 철회 기록</td><td>전자상거래 등에서의 소비자보호에 관한 법률</td><td>5년</td></tr>
<tr><td>대금 결제와 재화 공급 기록</td><td>전자상거래 등에서의 소비자보호에 관한 법률</td><td>5년</td></tr>
<tr><td>소비자 불만·분쟁 처리 기록</td><td>전자상거래 등에서의 소비자보호에 관한 법률</td><td>3년</td></tr>
<tr><td>접속 기록(IP, 접속 일시)</td><td>통신비밀보호법</td><td>3개월</td></tr>
</table>
<p>이용 계약이 끝나면 이름, 휴대폰 번호, PC 정보는 위 보관 의무가 없는 한 지체 없이 지웁니다. 사용 신청 후 승인되지 않은 신청 정보는 거절한 때 지웁니다.</p>

<h2>4. 파기 방법</h2>
<p>전자 파일은 되살릴 수 없는 방법으로 지우고, 종이 문서는 분쇄하거나 태웁니다.</p>

<h2>5. 제3자 제공</h2>
<p>회사는 이용자의 개인정보를 다른 사람에게 제공하지 않습니다. 다만 이용자가 미리 동의한 경우, 법령에 따라 수사기관 등이 정해진 절차로 요구한 경우에는 예외로 합니다.</p>

<h2>6. 처리 위탁과 국외 이전</h2>
<ul>
<li>회사는 개인정보 처리 업무를 다른 곳에 맡기지 않습니다. 라이선스 서버와 중계 서버는 회사가 직접 운영합니다.</li>
<li>회사 홈페이지와 설치 파일 다운로드는 GitHub(미국, GitHub Inc.)를 통해 제공됩니다. 홈페이지에 접속하거나 파일을 받을 때 접속자의 IP 주소 등이 GitHub에 의해 처리될 수 있으며, 이는 GitHub의 개인정보 정책을 따릅니다. 회사는 이 과정에서 이름, 휴대폰 번호 등 개인정보를 GitHub에 넘기지 않습니다.</li>
</ul>

<h2>7. 이용자의 권리</h2>
<ul>
<li>이용자는 언제든지 자신의 개인정보를 보거나, 고치거나, 지우거나, 처리를 멈춰 달라고 요구할 수 있습니다.</li>
<li>아래 연락처로 요청하면 지체 없이(늦어도 10일 안에) 처리하고 결과를 알립니다.</li>
<li>다만 지우거나 처리를 멈추면 라이선스 확인이 안 되어 프로그램을 쓸 수 없게 될 수 있습니다.</li>
<li>만 14세 미만 아동의 사용 신청은 받지 않습니다.</li>
</ul>

<h2>8. 안전성 확보 조치</h2>
<ul>
<li>프로그램과 서버 사이의 모든 통신은 암호화(https, TLS 1.2 이상)합니다.</li>
<li>라이선스는 전자서명으로 만들어 위조나 변조를 막습니다.</li>
<li>서버는 키 인증으로만 관리자 접속을 허용하고, 방화벽과 자동 차단(fail2ban), 보안 업데이트 자동 설치를 씁니다.</li>
<li>데이터베이스는 서버 밖에서 접근할 수 없게 막아 두고, 개인정보를 볼 수 있는 사람을 대표로 한정합니다.</li>
<li>백업은 암호화하여 보관합니다.</li>
</ul>

<h2>9. 쿠키</h2>
<p>회사 홈페이지는 쿠키를 쓰지 않으며, 방문자를 추적하는 분석 도구도 쓰지 않습니다.</p>
