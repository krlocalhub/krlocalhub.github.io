<h1>이용약관</h1>
<p class="meta">시행일: {{시행일}}</p>

<h2>제1조 (목적)</h2>
<p>이 약관은 {{상호}}(이하 "회사")가 제공하는 소프트웨어(회사가 제공하는 모든 프로그램과 그 업데이트, 이하 "프로그램")와 관련 서비스(라이선스 인증, 업데이트, 연결 중계 등, 이하 "서비스")의 이용 조건과 절차, 회사와 이용자의 권리·의무 및 책임 사항을 정하는 것을 목적으로 합니다.</p>

<h2>제2조 (용어의 뜻)</h2>
<ol>
<li>"이용자"란 이 약관에 따라 프로그램을 설치하고 서비스를 이용하는 개인 또는 사업자를 말합니다.</li>
<li>"라이선스"란 이용자가 정해진 기간 동안 승인된 PC에서 프로그램을 사용할 수 있는 권리를 말합니다.</li>
<li>"이용 기간"이란 라이선스가 유효한 기간을 말합니다.</li>
<li>"체험 기간"이란 결제 전에 프로그램을 무료로 써 볼 수 있도록 회사가 정한 기간을 말합니다.</li>
</ol>

<h2>제3조 (약관의 게시와 변경)</h2>
<ol>
<li>회사는 이 약관을 회사 홈페이지에 게시합니다.</li>
<li>회사는 관련 법령을 위반하지 않는 범위에서 약관을 변경할 수 있습니다. 변경할 때에는 시행일 7일 전부터(이용자에게 불리하거나 중요한 변경은 30일 전부터) 홈페이지 또는 프로그램 안내로 알립니다.</li>
<li>이용자가 변경된 약관에 동의하지 않으면 이용 계약을 해지할 수 있습니다. 시행일 이후에도 계속 이용하면 변경에 동의한 것으로 봅니다.</li>
</ol>

<h2>제4조 (이용 신청과 승인)</h2>
<ol>
<li>이용자는 프로그램을 처음 실행할 때 이름과 휴대폰 번호를 입력하여 사용을 신청합니다.</li>
<li>회사는 신청 내용을 확인한 뒤 승인합니다. 다음의 경우에는 승인하지 않거나 승인을 취소할 수 있습니다.
  <ul><li>다른 사람의 정보를 쓰거나 사실과 다른 정보를 넣은 경우</li><li>이전에 이 약관 위반으로 이용이 제한된 경우</li><li>그 밖에 승인하는 것이 법령이나 이 약관에 어긋나는 경우</li></ul></li>
<li>라이선스는 승인된 PC에 연결되며, 다른 PC로 옮기려면 회사에 요청해야 합니다.</li>
</ol>

<h2>제5조 (체험 기간)</h2>
<ol>
<li>회사는 결제 전에 프로그램을 무료로 써 볼 수 있는 체험 기간을 제공합니다. 체험 기간의 길이는 프로그램 안내 화면에 표시합니다.</li>
<li>체험 기간이 끝나면 결제하기 전까지 프로그램 사용이 멈춥니다. 자동으로 결제되지 않습니다.</li>
</ol>

<h2>제6조 (이용 요금과 결제)</h2>
<ol>
<li>이용 요금은 프로그램별로 승인된 PC 한 대마다 월 단위로 정해지며, 매달 쓸 수 있는 사용량이 함께 정해집니다. 금액과 사용량은 결제 전에 안내합니다.</li>
<li>요금은 이용 기간이 시작되기 전에 회사가 안내하는 방법으로 냅니다.</li>
<li>이용 기간이 끝나도 자동으로 결제되지 않습니다. 계속 쓰려면 연장 결제를 해야 하며, 연장하지 않으면 기간이 끝날 때 프로그램 사용이 멈춥니다.</li>
<li>회사가 요금을 올릴 때에는 적용 30일 전에 알리며, 이미 결제한 기간에는 적용하지 않습니다.</li>
<li>PC 수나 사용량을 이용 기간 중에 바꾸면 남은 기간에 맞춰 금액을 다시 계산합니다.</li>
</ol>

<h2>제7조 (환불)</h2>
<ol>
<li>프로그램은 결제 전에 무료 체험 기간을 제공하며, 회사는 이 사실과 아래 환불 기준을 결제 전에 알립니다. 이에 따라 전자상거래 등에서의 소비자보호에 관한 법률 제17조 제2항에 의해, 결제한 이용 요금은 이용자의 단순 변심이나 중도 해지를 이유로 환불하지 않습니다.</li>
<li>다만 다음의 경우에는 예외로 합니다.
  <ul><li>회사 사정으로 서비스를 끝내거나 제공하지 못한 경우: 남은 이용 기간만큼의 금액을 돌려드립니다.</li><li>회사 서버 장애 등 회사 책임으로 24시간 넘게 계속 사용하지 못한 경우: 그 기간만큼 이용 기간을 늘려 드립니다.</li><li>같은 기간에 대해 잘못하여 두 번 결제된 경우: 겹친 금액을 돌려드립니다.</li></ul></li>
<li>돌려드리는 금액은 확인한 날부터 3영업일 안에 결제한 방법 또는 이용자가 알려 준 계좌로 보냅니다.</li>
</ol>
<h2>제8조 (업데이트)</h2>
<ol>
<li>회사는 기능 개선, 오류 수정, 보안을 위해 프로그램을 업데이트하며, 이용 기간 중의 업데이트는 추가 요금 없이 제공합니다.</li>
<li>업데이트는 프로그램이 자동으로 받아 설치하며, 회사는 서명과 파일 지문(sha256)으로 변조되지 않은 파일인지 확인한 뒤 설치되게 합니다.</li>
</ol>

<h2>제9조 (이용자의 의무)</h2>
<p>이용자는 다음 행위를 해서는 안 됩니다.</p>
<ol>
<li>프로그램을 복제, 변경, 역설계(디컴파일·디스어셈블)하거나 라이선스 인증을 우회하는 행위</li>
<li>라이선스를 다른 사람에게 빌려주거나, 팔거나, 승인받지 않은 PC에서 쓰는 행위</li>
<li>프로그램을 다른 서비스(플랫폼)의 이용약관이나 법령을 위반하는 방법으로 쓰는 행위</li>
<li>다른 사람의 개인정보를 동의 없이 수집하거나 쓰는 행위</li>
<li>서비스 운영을 방해하거나 회사 서버에 비정상적으로 접근하는 행위</li>
</ol>
<p>이용자는 프로그램으로 연결하는 외부 서비스의 약관을 스스로 지켜야 하며, 그 위반으로 생긴 책임은 이용자에게 있습니다.</p>

<h2>제10조 (회사의 의무)</h2>
<ol>
<li>회사는 법령과 이 약관을 지키며, 서비스를 계속적이고 안정적으로 제공하기 위해 노력합니다.</li>
<li>회사는 이용자의 개인정보를 개인정보 처리방침에 따라 보호합니다.</li>
<li>회사는 이용자의 의견이나 불만이 정당하다고 인정되면 빨리 처리하고, 처리 결과를 알립니다.</li>
</ol>

<h2>제11조 (서비스의 중단)</h2>
<ol>
<li>회사는 서버 점검, 교체, 고장, 통신 장애 등이 있으면 서비스를 일시 중단할 수 있으며, 미리 알릴 수 있는 경우에는 미리 알립니다.</li>
<li>회사가 서비스를 끝내야 할 때에는 30일 전에 알리고, 제7조 제2항에 따라 남은 이용 기간의 금액을 돌려드립니다.</li>
</ol>

<h2>제12조 (이용 제한과 해지)</h2>
<ol>
<li>이용자는 언제든지 회사에 연락하여 이용 계약을 해지할 수 있습니다. 해지하면 다음 연장 결제가 이루어지지 않으며, 이미 결제한 금액은 제7조에 따릅니다.</li>
<li>이용자가 제9조를 위반하면 회사는 알린 뒤 이용을 제한하거나 계약을 해지할 수 있습니다. 위반 정도가 무거우면 미리 알리지 않고 제한할 수 있습니다.</li>
</ol>

<h2>제13조 (책임의 한계)</h2>
<ol>
<li>회사는 천재지변, 전쟁, 정전, 통신사 장애 등 회사가 막을 수 없는 사유로 서비스를 제공하지 못한 경우 책임을 지지 않습니다.</li>
<li>프로그램이 연결하는 외부 서비스(다른 회사의 플랫폼, 운영체제 등)의 정책이나 기능이 바뀌어 일부 기능이 동작하지 않는 경우, 회사는 빠르게 대응하도록 노력하되 그로 인한 손해에 대해서는 회사에 고의 또는 중대한 과실이 없으면 책임을 지지 않습니다.</li>
<li>프로그램이 이용자의 PC에 저장하는 자료는 이용자가 관리하며, 이용자는 중요한 자료를 따로 백업해야 합니다.</li>
<li>회사의 손해배상 책임은 회사에 고의 또는 중대한 과실이 없는 한, 손해가 생긴 달에 이용자가 낸 이용 요금을 넘지 않습니다.</li>
</ol>

<h2>제14조 (분쟁 해결과 관할)</h2>
<ol>
<li>회사와 이용자는 분쟁이 생기면 성실히 협의하여 해결합니다.</li>
<li>협의로 해결되지 않으면 민사소송법에 따른 관할 법원에서 해결합니다.</li>
</ol>
